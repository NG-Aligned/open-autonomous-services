[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-autonomous-services"
version = "0.2.0"
description = "A small decentralised framework for independently configured, cooperating autonomous services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oas = "oas.cli:main"

[tool.setuptools]
packages = ["oas"]
